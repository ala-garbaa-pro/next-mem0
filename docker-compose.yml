# Postgres 18 with the pgvector extension, for `bun dev` / `npx next-mem0`.
#   docker compose up -d
# Data persists in the named volume `next-mem0-pgdata`.
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: next-mem0-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: next_mem0
    ports:
      - "5432:5432"
    volumes:
      - next-mem0-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d next_mem0"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  next-mem0-pgdata:
